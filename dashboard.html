<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Quiz Dashboard</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="dashboard.css" />
</head>

<body>

  <header class="dashboard-header">
    <div class="dashboard-logo">
      🇮🇳 Indian GK Quiz
    </div>

    <div class="header-actions">
      <span id="headerUserName">Loading...</span>
      <button id="logoutBtn" class="logout-btn">Logout</button>
    </div>
  </header>

  <main class="dashboard-container">

    <!-- Welcome -->
    <section class="welcome-card">
      <div>
        <p class="welcome-small">Welcome back 👋</p>
        <h1 id="welcomeName">Player</h1>
        <p id="welcomeEmail">Loading...</p>
      </div>

      <button id="playQuizBtn" class="play-btn">
        🎮 PLAY QUIZ
      </button>
    </section>

    <!-- Stats -->
    <section class="stats-grid">

      <div class="stat-card">
        <div class="stat-icon">🎮</div>
        <div>
          <span class="stat-label">Games Played</span>
          <strong id="gamesPlayed">0</strong>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon">🏆</div>
        <div>
          <span class="stat-label">Wins</span>
          <strong id="totalWins">0</strong>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon">❌</div>
        <div>
          <span class="stat-label">Losses</span>
          <strong id="totalLosses">0</strong>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon">💰</div>
        <div>
          <span class="stat-label">Total Winnings</span>
          <strong>₹<span id="totalWinnings">0</span></strong>
        </div>
      </div>

    </section>

    <!-- Quick Actions -->
    <section class="quick-actions">

      <div class="section-title">
        <h2>Quick Actions</h2>
      </div>

      <div class="action-grid">

        <button id="historyBtn" class="action-card">
          <span>📜</span>
          <div>
            <strong>Game History</strong>
            <small>View your previous games</small>
          </div>
        </button>

        <button id="profileBtn" class="action-card">
          <span>👤</span>
          <div>
            <strong>My Profile</strong>
            <small>View your account details</small>
          </div>
        </button>

      </div>

    </section>

    <!-- Payment Status -->
    <section class="payment-section">

      <div class="section-title">
        <h2>Recent Payment</h2>
      </div>

      <div id="paymentCard" class="payment-card">
        <div class="payment-empty">
          <span>💳</span>
          <div>
            <strong>No payment requests</strong>
            <p>Your claimed rewards will appear here.</p>
          </div>
        </div>
      </div>

    </section>

    <!-- Loading -->
    <div id="dashboardLoading" class="dashboard-loading">
      Loading dashboard...
    </div>

    <!-- Error -->
    <div id="dashboardError" class="dashboard-error hidden"></div>

  </main>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Supabase configuration -->
  <script src="firebase.js"></script>

  <!-- Dashboard logic -->
  <script src="dashboard.js"></script>

</body>
</html>
