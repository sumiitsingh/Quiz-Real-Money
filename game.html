<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Play Quiz - Quiz Website</title>

  <link rel="stylesheet" href="game.css">
</head>

<body>

  <header class="game-header">

    <div class="game-logo">
      QUIZ
    </div>

    <div class="game-header-right">
      <span id="playerName">Player</span>

      <button id="exitGameBtn" class="exit-btn">
        Exit
      </button>
    </div>

  </header>


  <main class="game-container">

    <section class="game-top">

      <div class="progress-box">
        <span>Question</span>
        <strong>
          <span id="questionNumber">1</span>
          /
          <span id="totalQuestions">20</span>
        </strong>
      </div>

      <div class="score-box">
        <span>Correct</span>
        <strong id="correctCount">0</strong>
      </div>

      <div class="reward-box">
        <span>Current Reward</span>
        <strong id="currentReward">₹0</strong>
      </div>

    </section>


    <section class="timer-section">

      <div class="timer-circle" id="timerCircle">
        <span id="timer">10</span>
        <small>SEC</small>
      </div>

    </section>


    <section class="question-card">

      <div class="difficulty" id="difficulty">
        EASY
      </div>

      <h1 id="questionText">
        Loading question...
      </h1>

      <div
        id="optionsContainer"
        class="options-container"
      ></div>


      <div
        id="answerMessage"
        class="answer-message"
      ></div>


      <button
        id="nextBtn"
        class="next-btn"
        style="display:none;"
      >
        NEXT →
      </button>

    </section>


    <section
      id="milestoneBox"
      class="milestone-box"
      style="display:none;"
    >

      <div class="milestone-icon">
        🏆
      </div>

      <h2 id="milestoneTitle">
        Congratulations!
      </h2>

      <p id="milestoneText">
        You reached a reward milestone.
      </p>

      <div class="milestone-actions">

        <button
          id="claimBtn"
          class="claim-btn"
        >
          Claim Reward
        </button>

        <button
          id="continueBtn"
          class="continue-btn"
        >
          Continue
        </button>

      </div>

    </section>


    <section
      id="gameOverBox"
      class="game-over-box"
      style="display:none;"
    >

      <div class="game-over-icon">
        ❌
      </div>

      <h2>Game Over</h2>

      <p id="gameOverReason">
        Better luck next time!
      </p>

      <div class="final-score">
        <span>Correct Answers</span>
        <strong id="finalCorrect">0</strong>
      </div>

      <button
        id="backDashboardBtn"
        class="dashboard-btn"
      >
        Back to Dashboard
      </button>

    </section>


    <section
      id="finalWinBox"
      class="final-win-box"
      style="display:none;"
    >

      <div class="final-win-icon">
        🏆
      </div>

      <h2>Congratulations!</h2>

      <p>
        You completed all 20 questions.
      </p>

      <div class="final-reward">
        ₹500
      </div>

      <button
        id="claimFinalBtn"
        class="claim-btn"
      >
        Claim ₹500
      </button>

    </section>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="firebase.js"></script>
  <script src="game.js"></script>

</body>
</html>
