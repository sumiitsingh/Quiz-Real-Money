<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login - Quiz Website</title>

  <link rel="stylesheet" href="auth.css">

</head>


<body>

  <div class="auth-container">

    <div class="auth-card">

      <h1>
        Welcome Back
      </h1>

      <p class="auth-subtitle">
        Login to continue
      </p>


      <form id="loginForm">


        <!-- EMAIL -->
        <div class="form-group">

          <label for="email">
            Email
          </label>

          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >

        </div>


        <!-- PASSWORD -->
        <div class="form-group">

          <label for="password">
            Password
          </label>

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

        </div>


        <!-- LOGIN BUTTON -->
        <button
          type="submit"
          id="loginBtn"
        >
          Login
        </button>


        <!-- MESSAGE -->
        <p id="loginMessage"></p>

      </form>


      <p class="auth-link">

        Don't have an account?

        <a href="signup.html">
          Create Account
        </a>

      </p>

    </div>

  </div>


  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- SUPABASE CONFIG -->
  <script src="firebase.js"></script>

  <!-- AUTH LOGIC -->
  <script src="auth.js"></script>

</body>

</html>
