<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Profile - Quiz</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="profile.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="firebase.js"></script>
</head>

<body>

  <!-- HEADER -->
  <header class="profile-header">

    <div class="profile-logo">
      QUIZ
    </div>

    <div class="profile-header-right">
      <span id="headerUserName">Player</span>

      <button id="dashboardBtn" class="header-btn">
        Dashboard
      </button>

      <button id="logoutBtn" class="header-btn logout-btn">
        Logout
      </button>
    </div>

  </header>


  <!-- MAIN -->
  <main class="profile-container">

    <div id="profileLoading" class="profile-message">
      Loading profile...
    </div>

    <div id="profileError" class="profile-message error hidden">
    </div>


    <!-- PROFILE CONTENT -->
    <section id="profileContent" class="hidden">

      <div class="profile-title">
        <h1>My Profile</h1>
        <p>Manage your account and payout details.</p>
      </div>


      <!-- PERSONAL INFORMATION -->
      <div class="profile-card">

        <div class="card-heading">
          <h2>Personal Information</h2>
        </div>

        <div class="profile-grid">

          <div class="profile-field">
            <label>Full Name</label>
            <div id="profileName" class="field-value">
              -
            </div>
          </div>

          <div class="profile-field">
            <label>Email</label>
            <div id="profileEmail" class="field-value">
              -
            </div>
          </div>

          <div class="profile-field">
            <label>Account Type</label>
            <div id="profileRole" class="field-value">
              Player
            </div>
          </div>

          <div class="profile-field">
            <label>Account Created</label>
            <div id="profileCreated" class="field-value">
              -
            </div>
          </div>

        </div>

      </div>


      <!-- PAYOUT DETAILS -->
      <div class="profile-card">

        <div class="card-heading">
          <h2>Payout Details</h2>
          <p>At least one payout method is required.</p>
        </div>

        <form id="payoutForm">

          <div class="profile-grid">

            <div class="profile-field">

              <label for="upiId">
                UPI ID
              </label>

              <input
                type="text"
                id="upiId"
                placeholder="example@upi"
                autocomplete="off"
              >

            </div>


            <div class="profile-field">

              <label for="upiNumber">
                UPI Number
              </label>

              <input
                type="tel"
                id="upiNumber"
                placeholder="10 digit mobile number"
                maxlength="10"
                inputmode="numeric"
              >

            </div>

          </div>


          <div id="payoutMessage" class="form-message hidden">
          </div>


          <button
            type="submit"
            id="savePayoutBtn"
            class="save-btn"
          >
            Save Payout Details
          </button>

        </form>

      </div>


      <!-- ACCOUNT STATS -->
      <div class="profile-card">

        <div class="card-heading">
          <h2>My Statistics</h2>
        </div>

        <div class="stats-grid">

          <div class="stat-box">
            <span class="stat-icon">🎮</span>
            <strong id="statGames">0</strong>
            <span>Games Played</span>
          </div>

          <div class="stat-box">
            <span class="stat-icon">🏆</span>
            <strong id="statWins">0</strong>
            <span>Wins</span>
          </div>

          <div class="stat-box">
            <span class="stat-icon">❌</span>
            <strong id="statLosses">0</strong>
            <span>Losses</span>
          </div>

          <div class="stat-box">
            <span class="stat-icon">💰</span>
            <strong id="statWinnings">₹0</strong>
            <span>Total Winnings</span>
          </div>

        </div>

      </div>

    </section>

  </main>


  <script src="profile.js"></script>

</body>
</html>
